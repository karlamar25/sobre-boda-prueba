<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karla & Ricardo</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="intro" id="intro">

        <!-- =========================================
             SOBRE
        ========================================== -->

        <div class="escena" id="escena">

            <div class="sobre" id="sobre">

                <!-- Interior -->
                <div class="interior"></div>

                <!-- Tarjeta -->
                <div class="tarjeta" id="tarjeta">

                    <div class="tarjeta-borde">

                        <div class="tarjeta-titulo">
                            BODA
                        </div>

                        <div class="tarjeta-adorno"></div>

                        <div class="tarjeta-nombres">
                            Karla
                            <span>&amp;</span>
                            Ricardo
                        </div>

                        <div class="tarjeta-fecha">
                            05 · DICIEMBRE · 2026
                        </div>

                    </div>

                </div>

                <!-- Parte posterior -->
                <div class="sobre-posterior"></div>

                <!-- Frente -->
                <div class="sobre-frente"></div>

                <!-- Solapa -->
                <div class="solapa">

                    <div class="monograma">
                        K <span>&amp;</span> R
                    </div>

                </div>

                <!-- Sello -->
                <div class="sello">
                    <div class="sello-inner">
                        K <span>&amp;</span> R
                    </div>
                </div>

            </div>

        </div>


        <!-- =========================================
             PORTADA FINAL
             ESTÁ OCULTA HASTA EL FINAL
        ========================================== -->

        <div class="portada" id="portada">

            <div class="portada-contenido">

                <div class="portada-monograma">
                    K <span>&amp;</span> R
                </div>

                <div class="portada-linea"></div>

                <div class="portada-pequeno">
                    NUESTRA BODA
                </div>

                <h1>
                    Karla &amp; Ricardo
                </h1>

                <p>
                    05 · DICIEMBRE · 2026
                </p>

            </div>

        </div>

    </div>


    <script src="./script.js"></script>

</body>
</html>
