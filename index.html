<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karla & Ricardo</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="intro" id="intro">

        <div class="escena" id="escena">

            <div class="sobre" id="sobre">

                <!-- Papel interior -->
                <div class="papel-interior"></div>

                <!-- Tarjeta -->
                <div class="tarjeta">

                    <div class="tarjeta-marco">

                        <div class="tarjeta-small">
                            BODA
                        </div>

                        <div class="tarjeta-linea"></div>

                        <div class="tarjeta-nombres">
                            Karla
                            <span>&amp;</span>
                            Ricardo
                        </div>

                        <div class="tarjeta-fecha">
                            05 · 12 · 2026
                        </div>

                    </div>

                </div>

                <!-- Parte posterior del sobre -->
                <div class="sobre-base"></div>

                <!-- Frente -->
                <div class="sobre-frente"></div>

                <!-- Solapa -->
                <div class="solapa">

                    <div class="iniciales">
                        K <span>&amp;</span> R
                    </div>

                </div>

                <!-- Sello -->
                <div class="sello">

                    <div class="sello-borde">
                        <span>K</span>
                        <i>&amp;</i>
                        <span>R</span>
                    </div>

                </div>

            </div>

        </div>

        <!-- Transición final -->
        <section class="portada" id="portada">

            <div class="portada-contenido">

                <div class="portada-iniciales">
                    K <span>&amp;</span> R
                </div>

                <div class="portada-linea"></div>

                <div class="portada-etiqueta">
                    NUESTRA BODA
                </div>

                <h1>
                    Karla &amp; Ricardo
                </h1>

                <p>
                    05 · DICIEMBRE · 2026
                </p>

            </div>

        </section>

    </main>

    <script src="./script.js"></script>

</body>
</html>
